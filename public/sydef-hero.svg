<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 720" preserveAspectRatio="xMidYMid slice" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="creamZone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f5f0"/>
      <stop offset="55%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#ecfdf5" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="30%" stop-color="#7c2d12"/>
      <stop offset="55%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="72%" cy="42%" r="45%">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#f59e0b" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shieldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#99f6e4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#115e59" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <!-- Full-width art zone -->
  <rect width="1440" height="720" fill="url(#sky)"/>

  <g opacity="0.55" filter="url(#softBlur)">
    <polygon points="900,80 1050,40 1020,200" fill="#fb7185"/>
    <polygon points="1200,100 1380,180 1150,260" fill="#c026d3"/>
    <polygon points="880,520 1020,460 980,640" fill="#7f1d1d"/>
    <polygon points="1280,560 1400,480 1380,680" fill="#be123c"/>
  </g>

  <g fill="none" stroke="#fef08a" stroke-opacity="0.22">
    <circle cx="980" cy="310" r="70" stroke-width="1.5"/>
    <circle cx="980" cy="310" r="120" stroke-width="1.2"/>
    <circle cx="980" cy="310" r="175" stroke-width="1"/>
    <circle cx="980" cy="310" r="235" stroke-width="0.8"/>
  </g>

  <path d="M 760 310 A 220 220 0 0 1 1200 310" fill="none" stroke="#fcd34d" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="8 14"/>

  <g transform="translate(980 310)">
    <path d="M 0 -95 L 78 -28 L 48 82 L 0 118 L -48 82 L -78 -28 Z" fill="url(#shieldGlow)" stroke="#5eead4" stroke-width="2" stroke-opacity="0.85"/>
    <path d="M 0 -62 L 52 -18 L 32 54 L 0 78 L -32 54 L -52 -18 Z" fill="#134e4a" fill-opacity="0.55" stroke="#99f6e4" stroke-width="1.5" stroke-opacity="0.7"/>
  </g>

  <circle cx="980" cy="310" r="58" fill="url(#coreGlow)"/>
  <circle cx="980" cy="310" r="22" fill="#fffbeb" fill-opacity="0.92"/>
  <circle cx="980" cy="310" r="8" fill="#0f766e"/>

  <path d="M 680 650 L 980 330 L 1280 80 L 1440 0 L 1280 720 L 680 650 Z" fill="url(#beam)"/>

  <g stroke="#fde68a" stroke-opacity="0.35" stroke-width="1.5" fill="none">
    <path d="M 980 310 L 820 180"/>
    <path d="M 980 310 L 1140 190"/>
    <path d="M 980 310 L 790 420"/>
    <path d="M 980 310 L 1170 430"/>
    <circle cx="820" cy="180" r="5" fill="#fbbf24" fill-opacity="0.8" stroke="none"/>
    <circle cx="1140" cy="190" r="5" fill="#f472b6" fill-opacity="0.8" stroke="none"/>
    <circle cx="790" cy="420" r="5" fill="#34d399" fill-opacity="0.8" stroke="none"/>
    <circle cx="1170" cy="430" r="5" fill="#60a5fa" fill-opacity="0.8" stroke="none"/>
  </g>

  <path d="M 520 580 Q 760 540 980 560 T 1440 570 L 1440 720 L 520 720 Z" fill="#042f2e" fill-opacity="0.45"/>
  <path d="M 520 590 Q 820 555 980 575 T 1440 585" fill="none" stroke="#2dd4bf" stroke-opacity="0.35" stroke-width="2"/>

  <!-- Cream / mint left overlay for text -->
  <rect width="820" height="720" fill="url(#creamZone)"/>
  <rect x="680" y="0" width="140" height="720" fill="url(#creamZone)" opacity="0.6"/>
</svg>
